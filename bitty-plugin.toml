# Bitty plugin manifest.
#
# File name, keys, and limits are the accepted v1 contract in bitty-docs
# `docs/specifications/plugin-platform-rfc.md` (OQ-012). The plugin manager and
# the host parse this file independently before any plugin code runs.
#
# `just manifest` validates this file with the authoritative `bitty-plugin-lint`
# from bitty-plugin-sdk (R-SDK-2), pinned by commit in `package.json` and
# `bun.lock`. The pin tracks the frozen generation pipeline (SDK #109,
# re-wired by SDK #118, host parity from bitty #1303 as re-wired by bitty
# #1391). Run `just install` once to materialize it.

[plugin]
id = "bitty-terminal.bar"
name = "Unified Bar"
version = "0.0.1"
description = "Consolidated workspace-bar, tabs, and statusline presentation over generic chrome insets."
# Optional SPDX expression. Add a LICENSE file and set this before publishing.
license = "MIT"

[compat]
# Application and Plugin API ranges. Adjust to the host release you target;
# both are syntax-validated here and resolved by the host at install time.
bitty = ">=0.5,<1.0"
plugin-api = "^1.0"

[capabilities]
# Deny by default: omit this table entirely when the plugin needs no authority.
# Request capabilities one by one; unknown identifiers fail validation and
# there is no allow-all identifier. `platform.notify` backs the example command
# in `lua/bar/init.lua`. The `services` namespace is WIRED on
# the current host (bitty #1391): the example provides `greeter` live, so its
# implementation is declared here. The `env` namespace stays DEFERRED and
# fails closed with `E_NOT_IMPLEMENTED` on the current host (bitty #1303) even
# when declared, so this scaffold requests nothing for it.
platform.notify = true

[services.provided]
# Version-pinned service implementations served by `init.lua` via
# `bitty.services.provide`. Versions are syntax-validated here and resolved
# by the host at install time.
"bitty-terminal.bar.greeter" = "1.0.0"

[lazy]
# Static triggers let the host register the plugin without creating a VM.
# Commands are plugin-qualified: `<plugin-id>:<resource>`.
commands = ["bitty-terminal.bar:hello"]
