# Bitty plugin manifest.
#
# File name, keys, and limits are the accepted v1 contract in bitty-docs
# `docs/specifications/plugin-platform-rfc.md` (OQ-012). The plugin manager and
# the host parse this file independently before any plugin code runs.
#
# `just manifest` validates this file with the authoritative `bitty-plugin-lint`
# from bitty-plugin-sdk (R-SDK-2), pinned by commit in `package.json` and
# `bun.lock`. Run `just install` once to materialize it.

[plugin]
id = "bitty-terminal.bar"
name = "Unified Bar"
version = "0.0.1"
description = "Consolidated workspace-bar, tabs, and statusline presentation over generic chrome insets."
license = "MIT"

[compat]
# Application and Plugin API ranges. Both are syntax-validated here and
# resolved by the host at install time.
bitty = ">=0.5,<1.0"
plugin-api = "^1.0"

[capabilities]
# Deny by default; each capability is requested one by one.
# - ui.rich: mount and update the workspace bar band (`bitty.ui.mount/update`).
# - workspace.read: `bitty.workspace.list` and the `workspace.*` events.
# - workspace.control: `bitty.workspace.focus` for pill clicks (read never
#   implies control, ADR-0014).
ui.rich = true
workspace.read = true
workspace.control = true

[lazy]
# Static triggers let the host register the plugin without creating a VM.
# Commands are plugin-qualified: `<plugin-id>:<resource>`. `focus` is the
# click target bound to every inactive workspace pill.
commands = ["bitty-terminal.bar:focus"]
events = [
  "workspace.created",
  "workspace.closed",
  "workspace.renamed",
  "workspace.focused",
  "workspace.changed",
  "config.reloaded",
]
